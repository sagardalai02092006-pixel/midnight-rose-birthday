services:
  - type: web
    name: midnight-rose-birthday
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DB_PATH
        value: /var/data/birthday.db
      - key: SECRET_KEY
        generateValue: true
    # Add a persistent disk in Render dashboard for /var/data.
